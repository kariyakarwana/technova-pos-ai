name: AI CI and Image

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Test deployment authorization
        run: node --test deploy/check-release-owner.test.mjs

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check . --output-format=github

      - name: Test
        shell: bash
        run: |
          set +e
          uv run pytest --tb=short > pytest-output.log 2>&1
          status=$?
          set -e
          cat pytest-output.log
          if (( status != 0 )); then
            message="$(tail -n 100 pytest-output.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            printf '::error title=Pytest failure::%s\n' "$message"
            exit "$status"
          fi

  authorize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require owner's merge permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/check-release-owner.mjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AI image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        id: image_ref
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          image="${image,,}"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: technova-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      AI_IMAGE: ${{ needs.publish.outputs.image }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Recheck owner and current main before accessing VPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/check-release-owner.mjs
      - name: Require completed VPS setup
        env:
          READY: ${{ vars.VPS_DEPLOY_READY }}
        run: |
          test "$READY" = true || { echo 'Navod must complete the V1 VPS runbook before deployment.' >&2; exit 1; }
          test -n "$VPS_HOST" && test -n "$VPS_USER"
      - name: Validate immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          pattern='^ghcr\.io/kariyakarwana/technova-pos-ai@sha256:[0-9a-f]{64}$'
          if [[ ! "$AI_IMAGE" =~ $pattern ]]; then
            echo "Invalid AI_IMAGE reference: $AI_IMAGE" >&2
            exit 1
          fi

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_HOST }}

      - name: Prepare SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/technova_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/technova_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy AI service
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_command \
            'test "$(sudo /usr/local/sbin/technova-deploy --version)" = "technova-deploy 1.0.0" && sudo /usr/local/sbin/technova-deploy --ai %q' \
            "$AI_IMAGE"
          ssh -i "$HOME/.ssh/technova_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "$remote_command"


  release:
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record version after successful production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ${{ needs.publish.outputs.image }}
        run: node deploy/record-release.mjs
